name: iOS Crash Screenshot No-Freeze

# Regression guard for the sentry-cocoa crash-handler freeze (getsentry/sentry-cocoa#9281):
# crashing off the main thread with the UIScene lifecycle + a Swift (MainActor) scene delegate +
# attachScreenshot must NOT hang the crash handler. See
# scripts/verify-ios-crash-screenshot-no-freeze.sh for the full mechanism.
#
# It validates whatever sentry-cocoa the SDK currently bundles (fixed since 9.30.1), so it is wired
# to run when the bundled cocoa version changes (the podspec / version table) and on manual dispatch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/core/RNSentry.podspec"
      - "packages/core/scripts/sentry_utils.rb"
      - ".github/workflows/ios-crash-screenshot-no-freeze.yml"
      - "scripts/verify-ios-crash-screenshot-no-freeze.sh"
      - "samples/expo/plugins/withIosSceneLifecycle.js"
      - "samples/expo/app.json"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/core/RNSentry.podspec"
      - "packages/core/scripts/sentry_utils.rb"
      - ".github/workflows/ios-crash-screenshot-no-freeze.yml"
      - "scripts/verify-ios-crash-screenshot-no-freeze.sh"
      - "samples/expo/plugins/withIosSceneLifecycle.js"
      - "samples/expo/app.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ready-to-merge-gate:
    name: Ready-to-merge gate
    uses: ./.github/workflows/ready-to-merge-workflow.yml
    with:
      is-pr: ${{ github.event_name == 'pull_request' }}
      labels: ${{ toJson(github.event.pull_request.labels) }}

  verify:
    needs: [ready-to-merge-gate]
    name: Verify crash-time screenshot does not freeze
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          package-manager-cache: false
          node-version: 22
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with:
          working-directory: samples/expo
          ruby-version: "3.3.0"
          bundler-cache: true
          cache-version: 1

      - name: Install SDK Dependencies
        run: yarn install

      - name: Build SDK
        run: yarn build

      - name: Verify crash-time screenshot does not freeze the crash handler
        run: scripts/verify-ios-crash-screenshot-no-freeze.sh
