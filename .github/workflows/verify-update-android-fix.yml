# TEMPORARY: verifies the SIGPIPE/pipefail fix in scripts/update-android.sh.
# Reproduces the `update-deps` failure environment (ubuntu-latest) by running the
# real `set-version` path in a loop to stress the race. REMOVE before merging.
name: TEMP Verify update-android fix

on:
  push:
    branches:
      - fix/update-android-sigpipe

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stub the stubs updater (skip the heavy gradle jar build)
        run: |
          cat > scripts/update-android-stubs.sh <<'EOF'
          #!/usr/bin/env bash
          echo "[stub] skipping gradle jar build: $*"
          EOF
          chmod +x scripts/update-android-stubs.sh

      - name: Run set-version repeatedly to stress the pipefail/SIGPIPE race
        run: |
          for i in $(seq 1 50); do
            echo "--- iteration $i ---"
            scripts/update-android.sh set-version 8.58.0
          done
          grep -q 'expectedSentryAndroidVersion = "8.58.0"' packages/core/sentry.gradle.kts
          echo "OK: sentry.gradle.kts bumped and no broken-pipe failure across 50 runs"
